// 频道类型
enum ChatChannelType {
	CHAT_CHANNEL_RECRUIT = 0; // 招募频道
	CHAT_CHANNEL_THEATER = 1; // 战区频道
	CHAT_CHANNEL_WORLD = 2; // 世界频道
	CHAT_CHANNEL_PRIVATE = 3; // 私聊频道
	CHAT_CHANNEL_UNION = 4; // 联盟频道
}

// 玩家聊天展示信息
message CmdChatRole {
	required sint64 roleId = 1; // 角色id
	required string name = 2; // 角色名
	required sint64 img = 3; // 头像
	required sint64 headFrame = 4; // 头像框
	required string platformImg = 5; // 平台图标
	required sint32 level = 6; // 等级
	required sint64 power = 7; // 修练值（战力）
	required sint32 serverId = 8; // 服务器
	required sint32 selectServerId = 9; // 选择的服务器
	required sint32 titleId = 10; // 称号Id
	required sint64 lastOfflineTime = 11; // 最后一次下线时间，用于计算离线时长
}
message CmdChatRole_Key {
	required sint64 roleId = 1; // 角色id
}

// 聊天信息
message CmdChatMsgClient {
	required sint64 chatId = 1; // 聊天Id（自增长）
	required CmdChatRole speaker = 2; // 角色对象
	required sint64 sendTime =  3; // 发送时间
	required string content = 4; // 聊天信息
}

// 聊天信息
message CmdChatMsg {
	required sint64 chatId = 1; // 聊天Id 雪花算法生成唯一Id
	required sint64 sendId = 2; // 发送者Id
	required sint64 recvId = 3; // 接收者Id
	required sint64 sendTime =  4; // 发送时间
	required string content = 5; // 聊天信息
}
message CmdChatMsg_Key {
	required sint64 chatId = 1; // 聊天Id
}

// 初始化聊天数据
message CmdChatInitReqMsg {
	required sint32 channel = 1; // 频道
	optional sint64 id = 2; // 私聊，联盟用到 -- 玩家Id，联盟Id
	required sint32 page = 3;  // 页
}
message CmdChatInitRspMsg {
	optional sint32 ret = 1;  // 结果
	optional sint32 channel = 2; // 频道
	optional sint64 id = 3; // 私聊，联盟用到：玩家Id，联盟Id
	optional sint32 page = 4;  // 页
	repeated CmdChatMsgClient list = 5; // 聊天信息列表
}

// 用户发送聊天
message CmdChatSendReqMsg {
	required sint32 channel = 1; // 频道
	optional sint64 id = 2; // 私聊，联盟用到 -- 玩家Id，联盟Id
	required string content = 3; // 聊天信息
}
message CmdChatSendRspMsg {
	optional sint32 ret = 1;  // 结果
}
// 聊天广播数据
message CmdChatBroMsg {
	required sint32 channel = 1; // 频道
	required sint64 id = 2; // 私聊，联盟用到：玩家Id，联盟Id
	required CmdChatMsgClient content = 3; // 聊天信息列表
}

// 从聊天对象列表删除聊天对象
message CmdChatDelTargetReqMsg {
	required sint64 id = 1; // 玩家Id
}
message CmdChatDelTargetRspMsg {
	required sint64 id = 1; // 玩家Id
}

