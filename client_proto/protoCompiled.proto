	required sint32 selectServerId = 8; // 选择的服务器
	required sint32 titleId = 9; // 称号Id
	required sint32 position = 10; // 职位
	required bool online = 11; // 在线状态
	required sint64 lastOfflineTime = 12; // 最后一次下线时间
	required sint32 todayContribute = 13; // 今天贡献
	required sint32 allContribute = 14; // 所有贡献
