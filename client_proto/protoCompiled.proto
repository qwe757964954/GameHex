message CmdNewTreasureFastOpenReqMsg {
  required uint32 index      = 1;//对应下标
}

// 新宝箱响应快速开启
message CmdNewTreasureFastOpenRspMsg {
      required uint32 index      = 1;//对应下标
      required uint32 succ       = 2;//1成功2失败,收到成功移除宝箱
      repeated CmdGoods tlCmdGoods = 3; //物品列表
}

// 新宝箱请求开启
message CmdNewTreasureOpenReqMsg {
      required uint32 index      = 1;//对应下标
}

// 新宝箱响应开启
message CmdNewTreasureOpenRspMsg {
      required uint32 index      = 1;//对应下标
      required uint32 succ       = 2;//1成功2失败,收到成功移除宝箱
      repeated CmdGoods tlCmdGoods = 3; //物品列表
}

// 新宝箱广播
message CmdNewTreasureInfoBroMsg {
    required CmdNewTreasureInfo info = 1;//宝箱
}

// pvp英雄技能信息
message CmdPvpHeroSkillInfo {
   required uint32 id     = 1;//等级
   required uint32 level  = 2;//等级
}

// pvp英雄信息
message CmdPvpHeroInfo {
   required uint32 heroId = 1;//英雄id
   required uint32 level  = 2;//等级
   repeated CmdPvpHeroSkillInfo skills = 3;//技能等级
}

// pvp神器信息
message CmdPvpArtifactInfo {
   required uint32 artifactId = 1;//神器id
   required uint32 level      = 2;//神器等级
   required uint32 select     = 3;//1选中,0没有选中
}

// 请求pvp英雄列表
message CmdPvpHeroInfoListReqMsg {

}

// 响应pvp英雄列表
message CmdPvpHeroInfoListRspMsg {
   repeated CmdPvpHeroInfo infos = 1;//列表集合
}

// 请求pvp英雄升级
message CmdPvpHeroUpLevelReqMsg {
   required uint32 heroId = 1;//英雄id
}

// 响应pvp英雄升级
message CmdPvpHeroUpLevelRspMsg {
   required CmdPvpHeroInfo info = 1;//信息
}

// 请求pvp英雄技能升级
message CmdPvpHeroUpSkillReqMsg {
   required uint32 heroId  = 1;//英雄id
   required uint32 skillId = 2;//等级id
}

// 响应pvp英雄技能升级
message CmdPvpHeroUpSkillRspMsg {
   required CmdPvpHeroInfo info = 1;//信息
}

// 请求pvp神器列表
message CmdPvpArtifactInfoListReqMsg {

}

// 响应pvp神器列表
message CmdPvpArtifactInfoListRspMsg {
   repeated CmdPvpArtifactInfo infos = 1;//神器集合
}

// 请求升级pvp神器
message CmdPvpArtifactUpLevelReqMsg {
   required uint32 artifactId = 1;//神器id
}

// 响应升级pvp神器
message CmdPvpArtifactUpLevelRspMsg {
   required CmdPvpArtifactInfo info = 1;//神器
}

// 请求选中pvp神器
message CmdPvpArtifactSelectReqMsg {
   required uint32 artifactId = 1;//神器id
}

// 响应选中pvp神器
message CmdPvpArtifactSelectRspMsg {
   required CmdPvpArtifactInfo info = 1;//神器
}

// pvp信息
message CmdPvpInfo {
   required uint32 grade  = 1;//段位
   required uint32 score  = 2;//积分
   required uint32 winCount  = 3;//连胜次数
   required uint32 gradeRewardTag = 4;//奖励领取标记
}

// 战斗统计信息
message CmdBattleStatisticsInfo {
  required uint32 unitId     = 1;//单元id
  required uint32 eventType  = 2;//事件类型(1,怪物波次,塔防模式使用,k固定为0,v为波次数)
  required uint32 frameId    = 3;//帧id(某一帧触发)
  repeated string kv         = 4;//k_v_k_v的形式(前端后约定)
}

// 请求pvp玩法信息
message CmdPvpInfoReqMsg {

}

// 响应pvp玩法信息
message CmdPvpInfoRspMsg {
   required CmdPvpInfo info = 1;//pvp信息
}

// 请求领取pvp段位奖励
message CmdPvpGradeRewardReqMsg {

}

// 响应领取pvp段位奖励
message CmdPvpGradeRewardRspMsg {
   required uint32 gradeRewardTag = 1;//奖励领取标记
}

// pvp战斗单元展示信息
message CmdBattleUnitShowInfo {
   required uint64 roleId   = 1;//角色id
   required uint32 serverId = 2;//区服id
   required uint32 power    = 3;//战力
   required string name     = 4;//昵称
   required uint64 img      = 5;//头像id
   required uint64 headFrame = 6;//头像框id
   required uint32 gradeId      = 7;//段位id
   required uint32 gradeScore   = 8;//段位积分
}

// 战斗单元信息
message CmdBattleUnitInfo {

   required CmdBattleUnitShowInfo showInfo = 1;//展示信息

   //战斗相关
   required uint32 campId            = 2;//阵营id
   repeated CmdPvpHeroInfo heroInfos = 3;//英雄集合
   required uint32 artifactId        = 4;//神器id
   required uint32 artifactLevel     = 5;//神器等级
   required uint32 unitId            = 6;//单元id

}

// 请求战斗信息
message CmdStartBattleInfo {
     required uint32 battleType    = 1;//战斗类型
     repeated string battleParams  = 2;//战斗参数(业务指定)
}

// PVE战斗结果信息
message CmdPveBattleResultInfo {
  required int32  addScore  = 1;//本次加减分
  required uint32 newGrade  = 2;//新段位
  required uint32 newScore  = 3;//新积分
  repeated CmdGoods cmdGoods = 4;//道具奖励
  optional uint32 treasureId  = 5;//宝箱id
  
}

// 章节战斗结果信息(1002)
message CmdChapterBattleResultInfo {
  repeated CmdGoods cmdGoods = 1;//道具奖励
  optional uint32 treasureId  = 2;//宝箱id
}

// 战斗帧信息
message CmdBattleFrameInfo {
  required uint32 frameId = 1;//帧id
  required uint32 unitId  = 2;//单元id
  required uint32 op      = 3;//操作 1翻格(参数为格子id) 2释放技能(参数为释放技能位置,如无不用传) 3聊天(参数为聊天id) 4出生点(参数为格子id)
  repeated uint32 params  = 4;//操作参数格子坐标
}

// 请求开始战斗
message CmdStartBattleReqMsg {
   required CmdStartBattleInfo startBattleInfo = 1;//发起战斗信息
   optional string version = 2;//客户端版本号
}

// 响应开始战斗
message CmdStartBattleRspMsg {

   required uint32 code     = 1;//1成功,2失败
   required uint64 seed     = 2;//随机种子
   required string version  = 3;//版本号
   required string battleId = 4;//战斗id
   required CmdStartBattleInfo startBattleInfo = 5;//发起战斗信息
   repeated CmdBattleUnitInfo unitInfos = 6;//战斗单元集合

}

// 请求完成战斗
message CmdFinishBattleReqMsg {

  required uint32 clientTickCount            = 1;//前端tick总数
  required uint32 result                     = 2;//前端上报结果 1胜 2负
  repeated CmdBattleFrameInfo commands       = 3;//关键事件流
  repeated CmdBattleStatisticsInfo statisticsInfos = 4;//统计信息集合

}

// 响应完成战斗
message CmdFinishBattleRspMsg {
  required uint32 code = 1; //1成功
}

// 响应战斗结果(广播)
message CmdBattleResultBroMsg {
  required uint32 battleType = 1;//战斗类型
  required uint32 code       = 2;//1胜 2负
  required bytes  dataBytes  = 3;//结算数据(1001->CmdPveBattleResultInfo,)
}

