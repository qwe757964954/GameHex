// 联盟状态
enum CmdUnionState {
	FORMAL = 1; // 正常
	DISBAND = 2; // 解散
}

// 编辑联盟数据类型
enum CmdUnionEditType {
	NAME = 1; // 名字
	VXCHAT = 2; // 微信号
	NOTICE = 3; // 公告
	DECLARATION = 4; // 宣言
}

// 联盟进入状态
enum CmdUnionJoinState {
	QUIT = 0; // 退出
	JOIN = 1; // 进入
}

// 联盟职位
enum CmdUnionPosition {
	LEADER = 1; // 盟主
	DEPUTY = 2; // 副盟主
	MEMBER = 3; // 成员
}


// 联盟
message CmdUnion {
	required sint64 id = 1; // 联盟id
	required sint32 exp = 2; // 经验
	required sint32 level = 3; // 等级
	required sint32 icon = 4; // 联盟icon
	required sint32 count = 5; // 成员数
	required sint32 maxCount = 6; // 最大成员数
	required bool autoJoin = 7; // 是否自动加入
	required string name = 8; // 联盟名
	required sint64 leaderId = 9; // 盟主id
	required string leaderName = 10; // 盟主名
	required string notice = 11; // 联盟公告
	required string declaration = 12; // 联盟宣言
	required string wxChat = 13; // 微信号
	required sint32 serverId = 14; // 服务器id
	required sint32 selectServerId = 15; // 选择的服务器id
	required sint64 state = 16; // 联盟状态
}
message CmdUnion_Key {
	required sint64 id = 1; // 联盟id
}

// 联盟
message CmdUnionSimple {
	required sint64 id = 1; // 联盟id
	required sint32 icon = 2; // 联盟icon
	required sint32 level = 3; // 联盟icon
	required sint32 count = 4; // 成员数
	required sint32 maxCount = 5; // 最大成员数
	required sint64 leaderId = 6; // 盟主id
	required string name = 7; // 联盟名
	required string leaderName = 8; // 盟主名
	required sint32 serverId = 9; // 服务器id
	required sint32 selectServerId = 10; // 选择的服务器id
	required sint64 state = 11; // 联盟状态
}
message CmdUnionSimple_Key {
	required sint64 id = 1; // 联盟id
}

// 通用成员信息
message CmdUnionMember {
	required sint64 roleId = 1; // 角色id
	required string name = 2; // 角色名
	required sint64 img = 3; // 头像
	required sint64 headFrame = 4; // 头像框
	required sint32 level = 5; // 等级
