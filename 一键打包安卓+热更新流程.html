<svg viewBox="0 0 680 572" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">

<desc>入口是 tools\hotupdate\publish_hotupdate.bat，一次运行产出 APK 与热更 release 树。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="120" y="20" width="440" height="54" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="39" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">tools\hotupdate\publish_hotupdate.bat</text>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">双击走交互菜单 · 带参数直跑</text>

<line x1="340" y1="74" x2="340" y2="110" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="340" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">debug=false · md5Cache=false · 产物在 build/android/data</text>

<line x1="340" y1="168" x2="340" y2="204" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="120" y="208" width="440" height="54" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="227" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">[3/8] [4/8] 注入 main.js + 生成随包 project.manifest</text>
<text x="340" y="246" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">改的就是 build/android/data —— 必须排在 gradle 之前</text>

<line x1="340" y1="262" x2="340" y2="298" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="340" y="321" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">[5/8] gradle assembleRelease → APK</text>
<text x="340" y="340" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">默认自动，检测到 build/android/proj 就编；需 JDK 17</text>

<line x1="340" y1="356" x2="340" y2="392" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="120" y="396" width="440" height="54" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>

<text x="340" y="434" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">release 目录不可变 · latest.json 最后一步才原子切换</text>
